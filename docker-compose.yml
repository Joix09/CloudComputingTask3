# Local services for development: docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: rentaldb
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ keeps its data in a versioned subfolder, so mount the parent directory
      - pgdata:/var/lib/postgresql

  # Azure Storage emulator. The Functions runtime needs storage to run timer triggers locally.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
volumes:
  pgdata:
