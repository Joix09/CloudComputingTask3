# Local PostgreSQL for development: docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: rentaldb
      POSTGRES_USER: rental
      POSTGRES_PASSWORD: rental
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ keeps its data in a versioned subfolder, so mount the parent directory
      - pgdata:/var/lib/postgresql
volumes:
  pgdata:
