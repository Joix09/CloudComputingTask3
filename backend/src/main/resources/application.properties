spring.application.name=rental-api

# App Service tells the app which port to listen on via PORT
server.port=${PORT:8080}

# Database: values come from environment variables (App Service "Environment variables" in Azure)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rentaldb}
spring.datasource.username=${DB_USERNAME:rental}
spring.datasource.password=${DB_PASSWORD:rental}

# Creates/updates tables from the entities. Fine for a course project; Flyway would be the production choice.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Blob Storage for rental receipts. The default is the Azurite emulator from docker-compose
# (its well-known development key, not a secret). In Azure, set STORAGE_CONNECTION_STRING.
app.storage.connection-string=${STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
app.storage.receipts-container=receipts

# Comma-separated list of frontend URLs allowed to call the API from a browser
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger UI at /swagger-ui.html, OpenAPI spec at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
