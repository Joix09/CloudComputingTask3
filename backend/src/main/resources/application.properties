spring.application.name=rental-api

# App Service tells the app which port to listen on via PORT
server.port=${PORT:8080}

# Database: values come from environment variables (App Service "Environment variables" in Azure)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rentaldb}
spring.datasource.username=${DB_USERNAME:rental}
spring.datasource.password=${DB_PASSWORD:rental}

# Creates/updates tables from the entities. Fine for a course project; Flyway would be the production choice.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Comma-separated list of frontend URLs allowed to call the API from a browser
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger UI at /swagger-ui.html, OpenAPI spec at /v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
